[project]
name = "support-triage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "nald04.db@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.2.0",
    "google-genai>=3.3.0",
    "ollama>=0.6.3",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
support-triage = "support_triage:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
